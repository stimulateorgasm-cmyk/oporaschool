        <h1 style="color:#0d9488;font-size:28px">Образовательный центр «Опора»</h1>
        <p style="font-size:16px;line-height:1.6">Репетиторы, подготовка к ОГЭ, ЕГЭ, ВПР в станице Северской. Индивидуальные и групповые занятия для детей с 1 по 11 класс.</p>
        <h2 style="color:#0d9488;font-size:20px;margin-top:24px">Наши предметы и цены</h2>
        <table style="width:100%;border-collapse:collapse;font-size:15px">
          <tr style="background:#f0fdfa"><td style="padding:8px;border:1px solid #ccfbf1"><strong>Математика 1-4 классы</strong></td><td style="padding:8px;border:1px solid #ccfbf1">от 600₽ (группа), 1000₽ (индивидуально)</td></tr>
